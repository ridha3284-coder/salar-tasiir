<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>راتبي</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="theme-color" content="#0f6b68"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--cd:#fff;--tx:#14302d;--mu:#7a8c89;--pr:#0f6b68;--gd:#c9a24a;--rd:#c0392b;--gn:#1e8e5a;--bd:#e3ebe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1716;--cd:#16231f;--tx:#e6f1ee;--mu:#8fa5a1;--bd:#243430}}
:root[data-theme=dark]{--bg:#0d1716;--cd:#16231f;--tx:#e6f1ee;--mu:#8fa5a1;--bd:#243430}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;padding-bottom:84px;max-width:560px;margin:auto}
h2{font-size:18px;margin:0 0 10px}.pg{padding:14px}.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.g2 .cd{margin:0}
.mu{color:var(--mu);font-size:12px}.big{font-size:24px;font-weight:700}.gn{color:var(--gn)}.rd{color:var(--rd)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;background:var(--pr);color:#fff;margin-bottom:12px;cursor:pointer}
.btn.s{display:inline-block;width:auto;padding:6px 12px;font-size:13px;margin:0}.btn.o{background:none;border:1.5px solid var(--pr);color:var(--pr)}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:10px 0;cursor:pointer}nav button.on{color:var(--pr);font-weight:700}
nav span{display:block;font-size:20px}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}.md>div{background:var(--cd);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;margin:8px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;font:inherit;background:var(--bg);color:var(--tx)}
.x{background:none;border:0;color:var(--rd);font-size:16px;cursor:pointer}
@media print{nav,.no-print,.pg>.cd:not(#rp),.pg>.g2{display:none!important}body{padding:0}}
</style></head><body><div id="app"></div>
<nav id="nav"></nav><div id="mdl"></div>
<script>
const CATS=['طعام','منزل','نقل','صحة','ترفيه','أخرى'],COL=['#0f6b68','#8e5ce0','#c9a24a','#c0392b','#2d8fd0','#7a8c89'];
let S={salary:0,start:1,exp:[],out:[],goals:[],debts:[],loans:[],sav:0,theme:'',cb:{},rec:[],lr:0,pm:'d',pv:{},inst:[],arch:[],rows:[{l:'مصاريف الأسرة',p:58.6},{l:'القسط الشهري',p:11.4},{l:'سداد الدين المنفصل',p:18},{l:'ادخار للطوارئ',p:4.5},{l:'احتياطي للمصاريف غير المتوقعة',p:7.5}]},tab='home';
try{const r=localStorage.getItem('rateby');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('rateby',JSON.stringify(S))}catch(e){}};
const f=n=>Math.round(n).toLocaleString('en-US')+' دج';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cyc(){const t=new Date();t.setHours(0,0,0,0);let s=new Date(t.getFullYear(),t.getMonth(),S.start);if(s>t)s=new Date(t.getFullYear(),t.getMonth()-1,S.start);const e=new Date(s.getFullYear(),s.getMonth()+1,S.start);return{s:s.getTime(),days:Math.max(1,Math.round((e-t)/864e5)),total:Math.round((e-s)/864e5),el:Math.round((t-s)/864e5)+1}}
function calc(){const c=cyc(),ex=S.exp.filter(x=>x.d>=c.s),sp=ex.reduce((a,x)=>a+x.a,0),ou=S.out.filter(x=>x.d>=c.s).reduce((a,x)=>a+x.a,0),bal=S.salary-sp-ou;return{c,ex,sp,bal,pct:S.salary?Math.min(100,sp/S.salary*100):0,avg:sp/c.el,safe:Math.max(0,bal)/c.days}}
function modal(title,fields,ok){const m=document.getElementById('mdl');m.innerHTML=`<div class="md" onclick="if(event.target===this)this.remove()"><div><h2>${title}</h2>${fields.map(q=>`<label>${q.l}</label>${q.o?`<select id="f_${q.k}">${q.o.map(o=>`<option${o==q.v?' selected':''}>${o}</option>`).join('')}</select>`:`<input id="f_${q.k}" type="${q.t||'text'}" value="${esc(q.v)}" inputmode="${q.t=='number'?'decimal':'text'}">`}`).join('')}<br><button class="btn" id="mok">حفظ</button></div></div>`;document.getElementById('mok').onclick=()=>{const v={};fields.forEach(q=>{const x=document.getElementById('f_'+q.k).value;v[q.k]=q.t=='number'?parseFloat(x)||0:x.trim()});if(ok(v)!==false){m.innerHTML='';save();render()}}}
const addExp=i=>{const x=i>=0?S.exp[i]:null;modal(x?'تعديل مصروف':'تسجيل مصروف',[{k:'a',l:'السعر',t:'number',v:x?x.a:''},{k:'n',l:'ماذا اشتريت؟',v:x?x.n:''},{k:'c',l:'الفئة',o:CATS,v:x?x.c:''},{k:'o',l:'ملاحظات (اختياري)',v:x?x.o:''}],v=>{if(v.a<=0)return false;if(x)Object.assign(x,{a:v.a,n:v.n,c:v.c,o:v.o});else S.exp.push({id:Date.now(),a:v.a,n:v.n,c:v.c,o:v.o,d:Date.now()})})};
const rm=(k,i)=>{if(confirm('حذف؟')){S[k].splice(i,1);save();render()}};
function pay(k,i,lbl){modal(lbl,[{k:'a',l:'المبلغ',t:'number'}],v=>{if(v.a<=0)return false;S.out.push({a:v.a,d:Date.now()});if(k=='goals')S.goals[i].s+=v.a;if(k=='debts')S.debts[i].p+=v.a;if(k=='sav')S.sav+=v.a})}
function wd(){modal('سحب من المدخرات',[{k:'a',l:'المبلغ',t:'number'}],v=>{if(v.a<=0||v.a>S.sav)return false;S.sav-=v.a;S.out.push({a:-v.a,d:Date.now()})})}
const addG=()=>modal('هدف جديد',[{k:'n',l:'اسم الهدف'},{k:'t',l:'المبلغ المطلوب',t:'number'}],v=>{if(!v.n)return false;S.goals.push({n:v.n,t:v.t,s:0})});
const addD=()=>modal('دين جديد',[{k:'n',l:'اسم الدائن'},{k:'t',l:'المبلغ الكلي',t:'number'},{k:'o',l:'ملاحظات (اختياري)'}],v=>{if(!v.n)return false;S.debts.push({n:v.n,t:v.t,p:0,o:v.o})});
const addL=()=>modal('سلفة جديدة',[{k:'n',l:'اسم المقترض'},{k:'t',l:'المبلغ',t:'number'}],v=>{if(!v.n)return false;S.loans.push({n:v.n,t:v.t});S.out.push({a:v.t,d:Date.now()})});
const retL=i=>{if(confirm('تم استرجاع السلفة؟')){S.out.push({a:-S.loans[i].t,d:Date.now()});S.loans.splice(i,1);save();render()}};
function sett(){modal('الإعدادات',[{k:'s',l:'الراتب الشهري (دج)',t:'number',v:S.salary},{k:'d',l:'يوم بداية الشهر المالي (1-28)',t:'number',v:S.start},{k:'th',l:'المظهر',o:['تلقائي','فاتح','داكن']}],v=>{S.salary=v.s;S.start=Math.min(28,Math.max(1,v.d||1));S.theme={'فاتح':'light','داكن':'dark'}[v.th]||'';document.documentElement.dataset.theme=S.theme})}
function home(){const k=calc();return`<div class="pg"><div class="g2"><div class="cd" style="background:#fdeeee"><div class="mu rd">المصاريف</div><div class="big rd">${f(k.sp)}</div></div><div class="cd" style="background:#e9f6ee"><div class="mu gn">الرصيد الحالي</div><div class="big gn">${f(k.bal)}</div><div class="mu">راتب الدورة: ${f(S.salary)}</div></div></div>
<button class="btn" style="background:var(--gn)" onclick="addExp()">+ تسجيل مصروف</button>
<div class="cd"><div class="row" style="border:0;padding:0"><span class="mu">نسبة الاستهلاك</span><b>${k.pct.toFixed(0)}%</b></div><div class="bar"><i style="width:${k.pct}%;background:${k.pct>85?'var(--rd)':'var(--gn)'}"></i></div></div>
${bw()}${k.sp?`<div class="cd"><div class="mu">📈 توقع نهاية الدورة</div><div class="big ${k.avg*k.c.total>S.salary?'rd':'gn'}">${f(k.avg*k.c.total)}</div><div class="mu">${k.avg*k.c.total>S.salary?'⚠ بهذا المعدل ستتجاوز راتبك، اجعل صرفك اليومي ≤ '+f(k.safe):'بهذا المعدل ستنهي الدورة ضمن الميزانية ✅'}</div></div>`:''}<div class="g2"><div class="cd"><div class="mu">المعدل اليومي</div><div class="big">${f(k.avg)}</div></div><div class="cd"><div class="mu">الأيام المتبقية</div><div class="big">${k.c.days} يوم</div></div></div>
<div class="cd"><div class="mu">🛡 الصرف الآمن يومياً</div><div class="big">${f(k.safe)}</div></div>
<h2>آخر المصاريف</h2><div class="cd">${k.ex.length?k.ex.slice().reverse().slice(0,15).map(x=>`<div class="row"><div><b>${esc(x.n||x.c)}</b><div class="mu">${esc(x.c)} · ${new Date(x.d).toLocaleDateString('ar-DZ')}${x.o?' · '+esc(x.o):''}</div></div><div><span class="rd">${f(x.a)}</span> <button class="x" style="color:var(--pr)" onclick="addExp(${S.exp.indexOf(x)})">✎</button><button class="x" onclick="rm('exp',${S.exp.indexOf(x)})">✕</button></div></div>`).join(''):'<div class="mu">لا توجد مصاريف بعد</div>'}</div><div class="g2"><button class="btn s o" onclick="bk()">📤 نسخ احتياطي</button><button class="btn s o" onclick="rs()">📥 استعادة</button></div></div>`}
function goals(){const li=(a,k,fn)=>a.length?a.map((x,i)=>fn(x,i)).join(''):'<div class="mu">لا يوجد حالياً</div>';
return`<div class="pg"><div class="cd"><div class="row" style="border:0"><div><div class="mu">المدخرات</div><div class="big">${f(S.sav)}</div></div><div><button class="btn s" onclick="pay('sav',0,'إيداع في المدخرات')">إيداع</button> <button class="btn s o" onclick="wd()">سحب</button></div></div></div>
<div class="cd"><div class="row"><h2>🏁 الأهداف المالية</h2><button class="btn s" onclick="addG()">+</button></div>${li(S.goals,'goals',(x,i)=>`<div class="row"><div style="flex:1"><b>${esc(x.n)}</b><div class="mu">${f(x.s)} من ${f(x.t)}</div><div class="bar"><i style="width:${x.t?Math.min(100,x.s/x.t*100):0}%"></i></div></div><button class="btn s" onclick="pay('goals',${i},'إضافة إلى الهدف')">ادخار</button><button class="x" onclick="rm('goals',${i})">✕</button></div>`)}</div>
<div class="cd"><div class="row"><h2>💲 الديون</h2><button class="btn s" onclick="addD()">+</button></div>${li(S.debts,'debts',(x,i)=>`<div class="row"><div style="flex:1"><b>${esc(x.n)}</b><div class="mu">المتبقي ${f(x.t-x.p)} من ${f(x.t)}${x.o?' · '+esc(x.o):''}</div><div class="bar"><i style="width:${x.t?Math.min(100,x.p/x.t*100):0}%"></i></div></div><button class="btn s" onclick="pay('debts',${i},'تسديد دين')">سداد</button><button class="x" onclick="rm('debts',${i})">✕</button></div>`)}</div>
<div class="cd"><div class="row"><h2>🤝 السلف</h2><button class="btn s" onclick="addL()">+</button></div>${li(S.loans,'loans',(x,i)=>`<div class="row"><div><b>${esc(x.n)}</b><div class="mu">${f(x.t)}</div></div><button class="btn s o" onclick="retL(${i})">استرجاع</button></div>`)}</div><div class="cd"><div class="row"><h2>💳 الأقساط</h2><button class="btn s" onclick="addI()">+</button></div>${li(S.inst,'inst',(x,i)=>`<div class="row"><div style="flex:1"><b>${esc(x.n)}</b><div class="mu">${f(x.m)} · متبقي ${x.r} من ${x.c} (${f(x.r*x.m)})</div><div class="bar"><i style="width:${x.c?(x.c-x.r)/x.c*100:0}%"></i></div></div><button class="btn s" onclick="payI(${i})">دفع</button><button class="x" onclick="undoI(${i})">↶</button><button class="x" onclick="rm('inst',${i})">✕</button></div>`)}</div><div class="cd"><div class="row"><h2>🔁 مصاريف ثابتة شهرية</h2><button class="btn s" onclick="addR()">+</button></div>${li(S.rec,'rec',(x,i)=>`<div class="row"><div><b>${esc(x.n)}</b><div class="mu">${esc(x.c)} · ${f(x.a)}</div></div><button class="x" onclick="rm('rec',${i})">✕</button></div>`)}<div class="mu">تُسجَّل تلقائياً عند بداية كل دورة جديدة</div></div></div>`}
function stats(){const k=calc(),by=CATS.map(c=>k.ex.filter(x=>x.c==c).reduce((a,x)=>a+x.a,0)),tot=by.reduce((a,b)=>a+b,0);let off=0;const R=60,C=2*Math.PI*R;
const ring=tot?by.map((v,i)=>{const l=v/tot*C,s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${COL[i]}" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=l;return s}).join(''):'';
const n=k.c.total,cum=[];let a=0;for(let d=0;d<k.c.el;d++){a+=k.ex.filter(x=>Math.floor((x.d-k.c.s)/864e5)==d).reduce((q,x)=>q+x.a,0);cum.push(a)}
const mx=Math.max(S.salary,a,1),X=i=>10+i/Math.max(1,n-1)*300,Y=v=>110-v/mx*100,pts=cum.map((v,i)=>X(i)+','+Y(v)).join(' ');
const t=S.salary&&k.c.el>=1?(k.pct<=70?['🏆 أسطوري','أداء مالي استثنائي'] : k.pct<=100?['👍 جيد','واصل التحكم في مصاريفك']:['⚠ تجاوزت الراتب','راجع مصاريفك']):['','']
return`<div class="pg">${t[0]?`<div class="cd" style="background:var(--gd);color:#fff;text-align:center"><div class="big">${t[0]}</div><div>${t[1]}</div></div>`:''}
<div class="cd"><h2>مسار الإنفاق</h2><svg viewBox="0 0 320 120" width="100%"><line x1="10" x2="310" y1="${Y(S.salary)}" y2="${Y(S.salary)}" stroke="var(--rd)" stroke-dasharray="4"/><polyline points="${pts}" fill="none" stroke="var(--pr)" stroke-width="2.5"/></svg><div class="mu">الخط المتقطع: سقف الميزانية</div></div>
<div class="cd"><h2>توزيع المصاريف</h2>${tot?`<svg viewBox="0 0 160 160" width="160" style="display:block;margin:auto">${ring}</svg>`:'<div class="mu">لا توجد بيانات</div>'}${CATS.map((c,i)=>by[i]?`<div class="row"><span><span style="color:${COL[i]}">●</span> ${c}</span><span class="${S.cb[c]&&by[i]>S.cb[c]?'rd':''}">${f(by[i])} (${(by[i]/tot*100).toFixed(0)}%)${S.cb[c]?' / '+f(S.cb[c]):''}</span></div>`:'').join('')}<br><button class="btn s o" onclick="cbm()">🎚 ميزانيات الفئات</button></div>${cmp()}</div>`}
function render(){document.getElementById('app').innerHTML={home,goals,stats,plan}[tab]?{home,goals,stats,plan}[tab]():'';
document.getElementById('nav').innerHTML=[['home','🏠','الرئيسية'],['goals','🎯','الأهداف'],['plan','🗂','الخطة'],['stats','📊','الإحصائيات'],['set','⚙','الإعدادات']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function go(t){if(t=='set'){sett();return}tab=t;render()}
function cs(ts){const t=new Date(ts);t.setHours(0,0,0,0);let s=new Date(t.getFullYear(),t.getMonth(),S.start);if(s>t)s=new Date(t.getFullYear(),t.getMonth()-1,S.start);return s.getTime()}
function cmp(){const m={};S.exp.forEach(x=>{const k=cs(x.d);m[k]=(m[k]||0)+x.a});const ks=Object.keys(m).sort().slice(-6);if(ks.length<2)return'<div class="cd"><h2>مقارنة الأشهر</h2><div class="mu">بيانات غير كافية للمقارنة</div></div>';const mx=Math.max(...ks.map(k=>m[k])),l=m[ks[ks.length-1]],p=m[ks[ks.length-2]],df=p?(l-p)/p*100:0;return`<div class="cd"><h2>مقارنة الأشهر</h2>${ks.map(k=>`<div class="row"><span class="mu" style="width:70px">${new Date(+k).toLocaleDateString('ar-DZ',{month:'short',year:'2-digit'})}</span><div class="bar" style="flex:1;margin:0"><i style="width:${m[k]/mx*100}%;background:var(--pr)"></i></div><span>${f(m[k])}</span></div>`).join('')}<div class="mu">${df>0?'ارتفع':'انخفض'} إنفاق الدورة الحالية بنسبة ${Math.abs(df).toFixed(0)}% عن السابقة</div></div>`}
function bk(){document.getElementById('mdl').innerHTML=`<div class="md" onclick="if(event.target===this)this.remove()"><div><h2>نسخ احتياطي</h2><textarea id="bt" rows="6" readonly>${esc(JSON.stringify(S))}</textarea><br><br><button class="btn" onclick="bt.select();try{navigator.clipboard.writeText(bt.value)}catch(e){document.execCommand('copy')}">نسخ</button><div class="mu">الصق النص في ملاحظاتك أو رسالة لنفسك لحفظه.</div></div></div>`}
function rs(){document.getElementById('mdl').innerHTML=`<div class="md" onclick="if(event.target===this)this.remove()"><div><h2>استعادة نسخة</h2><textarea id="bt" rows="6" placeholder="الصق النسخة هنا"></textarea><br><br><input type="file" accept=".json,application/json" onchange="const r=new FileReader();r.onload=()=>bt.value=r.result;r.readAsText(this.files[0])"><div class="mu">يقبل نسخ «راتبي»، و«مسيّر الميزانية»، و«مسيّر الراتب».</div><br><button class="btn" onclick="try{imp(JSON.parse(bt.value))}catch(e){alert('نص غير صالح')}">استعادة</button></div></div>`}
const PL={d:[['الالتزامات العائلية',[['mom1','مساعدة الوالدة (ثابتة)',10000],['mom2','مساعدة الوالدة (إضافية)',5000],['wife','مصروف الزوجة',0]]],['النفقات الأساسية',[['veg','خضر وفواكه',6000],['meat','لحوم',5000],['groc','مواد غذائية عامة',9000],['cloth','لباس',2000],['trans','نقل',4000],['bills','فواتير وأخرى',6000]]],['سداد الدين والادخار',[['dpay','دفعة سداد الدين',50000],['sav','ادخار طوارئ',7000]]]],p:[['الالتزامات العائلية',[['mom1','مساعدة الوالدة (ثابتة)',10000],['mom2','مساعدة الوالدة (إضافية)',5000],['wife','مصروف الزوجة',20000]]],['النفقات الأساسية',[['veg','خضر وفواكه',7000],['meat','لحوم',7000],['groc','مواد غذائية عامة',10000],['cloth','لباس',4000],['trans','نقل',5000],['bills','فواتير وأخرى',6000]]],['الأقساط والاستثمار',[['inst','أقساط جارية',0],['inv','استثمار شهري',8000],['sav','ادخار طوارئ',8000]]],['مشاريع مستقبلية',[['umrah','عمرة',3000],['hajj','حج',2000],['tour','سياحة',2000],['build','بناء / سكن',3000]]]]};
const DEF={};for(const m in PL)PL[m].forEach(g=>g[1].forEach(q=>DEF[m+q[0]]=q[2]));
const pv=k=>S.pv[k]!=null?S.pv[k]:(DEF[k]||0);
const setPv=(k,v)=>{S.pv[k]=parseFloat(v)||0;save();render()};
function plan(){const m=S.pm,c=calc();let tot=0;const h=PL[m].map(([t,ls])=>`<div class="cd"><h2>${t}</h2>${ls.map(([k,l])=>{const v=pv(m+k);tot+=v;return`<div class="row"><span>${l}</span><input type="number" inputmode="decimal" value="${v}" style="width:110px;text-align:center" onchange="setPv('${m+k}',this.value)"></div>`}).join('')}</div>`).join(''),rem=S.salary-tot,bs=['veg','meat','groc','cloth','trans','bills'].reduce((a,q)=>a+pv(m+q),0),ac=c.ex.filter(x=>['طعام','منزل','نقل'].indexOf(x.c)>=0).reduce((a,x)=>a+x.a,0);
return`<div class="pg"><div class="g2"><button class="btn ${m=='d'?'':'o'}" onclick="S.pm='d';save();render()">📉 خطة سداد الدين</button><button class="btn ${m=='p'?'':'o'}" onclick="S.pm='p';save();render()">🏠 الخطة الدائمة</button></div>${h}<div class="cd"><div class="row"><span>إجمالي الخطة</span><b>${f(tot)}</b></div><div class="row"><span>الراتب</span><b>${f(S.salary)}</b></div><div class="row"><span>${rem>=0?'الفائض':'العجز'}</span><b class="${rem>=0?'gn':'rd'}">${f(Math.abs(rem))}</b></div><div class="row"><span>الأساسيات: المخطط / الفعلي</span><b class="${ac>bs?'rd':'gn'}">${f(bs)} / ${f(ac)}</b></div></div>${dist()}${rep()}</div>`}
function dist(){const t=S.rows.reduce((a,r)=>a+r.p,0);return`<div class="cd"><div class="row"><h2>⚖ توزيع الراتب بالنسب</h2><button class="btn s" onclick="addRow()">+</button></div>${S.rows.map((r,i)=>`<div class="row"><span style="flex:1">${esc(r.l)}</span><input type="number" step="0.1" value="${r.p}" style="width:70px;text-align:center" onchange="S.rows[${i}].p=parseFloat(this.value)||0;save();render()"><span class="mu" style="width:90px;text-align:left">${f(S.salary*r.p/100)}</span><button class="x" onclick="rm('rows',${i})">✕</button></div>`).join('')}<div class="row"><span>المجموع</span><b class="${Math.abs(t-100)<.05?'gn':'rd'}">${t.toFixed(1)}%</b></div></div>`}
const addRow=()=>modal('بند توزيع',[{k:'l',l:'الاسم'},{k:'p',l:'النسبة %',t:'number'}],v=>{if(!v.l)return false;S.rows.push({l:v.l,p:v.p})});
const addI=()=>modal('قسط جديد',[{k:'n',l:'الجهة'},{k:'m',l:'القسط الشهري',t:'number'},{k:'c',l:'عدد الأقساط',t:'number'}],v=>{if(!v.n||v.m<=0)return false;S.inst.push({n:v.n,m:v.m,c:v.c,r:v.c,p:[]})});
const payI=i=>{const x=S.inst[i];if(x.r<=0)return;x.r--;x.p.push(Date.now());S.out.push({a:x.m,d:Date.now()});save();render()};
const undoI=i=>{const x=S.inst[i];if(!x.p.length)return;x.r++;x.p.pop();S.out.push({a:-x.m,d:Date.now()});save();render()};
function rep(){const k=calc(),ou=S.out.filter(x=>x.d>=k.c.s).reduce((a,x)=>a+x.a,0),iR=S.inst.reduce((a,x)=>a+x.r*x.m,0),dR=S.debts.reduce((a,x)=>a+x.t-x.p,0),mo=new Date(k.c.s).toLocaleDateString('ar-DZ',{month:'long',year:'numeric'}),R=(l,v,c)=>`<div class="row"><span>${l}</span><b class="${c||''}">${v}</b></div>`;window.CUR={k:k.c.s,m:mo,sal:S.salary,sp:k.sp,bal:k.bal,dR,iR};
return`<div class="cd" id="rp"><h2>📊 تقرير الدورة (${mo})</h2>${R('الراتب',f(S.salary))}${R('المصاريف',f(k.sp),'rd')}${R('أقساط وديون وادخار مدفوعة',f(ou))}${R('الرصيد',f(k.bal),k.bal>=0?'gn':'rd')}${R('ديون متبقية',f(dR))}${R('أقساط متبقية',f(iR))}<div class="g2 no-print" style="margin-top:10px"><button class="btn s" onclick="arch()">💾 حفظ في الأرشيف</button><button class="btn s o" onclick="print()">🖨 طباعة PDF</button></div>${S.arch.length?'<h2 style="margin-top:12px">🗃 الأرشيف</h2>'+S.arch.slice().reverse().map(x=>`<div class="row"><div><b>${esc(x.m)}</b><div class="mu">راتب ${f(x.sal)} · مصاريف ${f(x.sp)} · رصيد ${f(x.bal)}</div></div><button class="x no-print" onclick="rm('arch',${S.arch.indexOf(x)})">✕</button></div>`).join(''):''}</div>`}
function arch(){const e=Object.assign({},window.CUR),i=S.arch.findIndex(x=>x.k===e.k);if(i>=0)S.arch[i]=e;else S.arch.push(e);save();render()}
const AK={mom1:'mom1',mom2:'mom2',wife:'wife',veg:'veg',meat:'meat',grocery:'groc',cloth:'cloth',transport:'trans',bills:'bills',debtPay:'dpay',saving:'sav',installments:'inst',invest:'inv',umrah:'umrah',hajj:'hajj',tour:'tour',build:'build'};
function legA(d){const g=k=>parseFloat(d[k])||0;S.salary=g('d_income')||g('p_income')||S.salary;for(const k in d){const m=k.match(/^([dp])_(\w+)$/);if(m&&AK[m[2]])S.pv[m[1]+AK[m[2]]]=g(k)}if(g('d_debtRemain'))S.debts.push({n:'دين (مستورد)',t:g('d_debtRemain'),p:0,o:''});(d._expenses||[]).forEach(e=>S.exp.push({id:Date.now()+Math.random(),a:e.amount,n:e.note||'',c:{cafe:'ترفيه',home:'منزل',school:'منزل',transport:'نقل'}[e.cat]||'طعام',o:'',d:new Date(e.date).getTime()||Date.now()}));(d._archive||[]).forEach(x=>S.arch.push({k:0,m:x.month,sal:x.income,sp:x.total,bal:x.remain,dR:x.debtRemainAfter,iR:0}))}
function legB(d){S.salary=d.salary||S.salary;if(d.mother)S.rec.push({n:'مساعدة الوالدة',a:d.mother,c:'أخرى'});if(d.alimony)S.rec.push({n:'النفقة',a:d.alimony,c:'أخرى'});S.inst=S.inst.concat(d.installments.filter(x=>x.entity||x.monthly>0).map(x=>({n:x.entity||'قسط',m:x.monthly,c:x.total,r:x.remaining,p:[]})));S.debts=S.debts.concat((d.debts||[]).filter(x=>x.entity||x.totalAmount>0).map(x=>({n:x.entity||'دين',t:x.totalAmount,p:x.paid||0,o:''})));if(Array.isArray(d.rows))S.rows=d.rows.map(r=>({l:r.label,p:r.percent}));(d.monthlyReports||[]).forEach(x=>S.arch.push({k:0,m:x.month,sal:x.salary,sp:x.totalFixed,bal:x.remaining,dR:x.debtsRemainingTotal,iR:x.installmentsRemainingTotal}))}
function imp(d){if(Array.isArray(d.exp))Object.assign(S,d);else if(d.d_income!=null||d._expenses||d._archive)legA(d);else if(Array.isArray(d.installments))legB(d);else throw 0;save();document.getElementById('mdl').innerHTML='';render()}
function applyRec(){const c=cs(Date.now());if(S.salary&&S.lr!==c){if(S.lr)S.rec.forEach(r=>S.exp.push({id:Date.now(),a:r.a,n:r.n,c:r.c,o:'ثابت',d:Date.now()}));S.lr=c;save()}}
const addR=()=>modal('مصروف ثابت شهري',[{k:'n',l:'الاسم (إيجار، اشتراك...)'},{k:'a',l:'المبلغ',t:'number'},{k:'c',l:'الفئة',o:CATS}],v=>{if(!v.n||v.a<=0)return false;S.rec.push({n:v.n,a:v.a,c:v.c});S.exp.push({id:Date.now(),a:v.a,n:v.n,c:v.c,o:'ثابت',d:Date.now()});S.lr=S.lr||cs(Date.now())});
const cbm=()=>modal('ميزانيات الفئات (0 = بلا حد)',CATS.map(c=>({k:c,l:c,t:'number',v:S.cb[c]||''})),v=>{CATS.forEach(c=>{if(v[c]>0)S.cb[c]=v[c];else delete S.cb[c]})});
function bw(){const k=calc(),w=CATS.filter(c=>S.cb[c]).map(c=>[c,k.ex.filter(x=>x.c==c).reduce((a,x)=>a+x.a,0)/S.cb[c]]).filter(x=>x[1]>=.8);return w.length?`<div class="cd" style="border-color:var(--rd)">${w.map(x=>`<div class="row"><span>${x[1]>=1?'🚨':'⚠'} ${x[0]}</span><b class="rd">${(x[1]*100).toFixed(0)}% من الحد</b></div>`).join('')}</div>`:''}
if(S.theme)document.documentElement.dataset.theme=S.theme;applyRec();render();if(!S.salary)sett();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
